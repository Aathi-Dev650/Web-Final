<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f8f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:#fff;
    padding:40px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h2{
    color:#2e7d32;
    margin-bottom:30px;
    font-weight:500;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    color:#333;
}

select,
input{
    width:100%;
    padding:11px;
    border:1px solid #cfcfcf;
    border-radius:4px;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#2e7d32;
}

.form-group{
    margin-bottom:20px;
}

.mobile-box{
    display:flex;
    gap:10px;
}

.country-code{
    width:60px;
    text-align:center;
    background:#f5f5f5;
}

.mobile-number{
    flex:1;
}

button{
    width:100%;
    padding:13px;
    background:#2e7d32;
    color:#fff;
    border:none;
    border-radius:4px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#256428;
}

.error{
    color:red;
    font-size:14px;
    margin-top:10px;
    text-align:center;
}

.success{
    color:green;
    font-size:14px;
    margin-top:10px;
    text-align:center;
}
.signup{
    margin-top:20px;
    text-align:center;
    font-size:15px;
}

.signup a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

.signup a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="container">

<h2>Login / Register</h2>

<div class="form-group">
<label>Language</label>
<select id="language">
<option>English</option>
<option>Tamil</option>
<option>Hindi</option>
<option>Telugu</option>
</select>
</div>

<div class="form-group">
<label>Mobile Number</label>

<div class="mobile-box">
<input type="text" class="country-code" value="+91" readonly>

<input
type="text"
id="mobile"
class="mobile-number"
placeholder="Enter mobile number"
maxlength="10">
</div>

</div>

<div class="form-group">
<label>District</label>

<select id="district">
<option>Coimbatore</option>
<option>Chennai</option>
<option>Madurai</option>
<option>Salem</option>
<option>Tiruppur</option>
<option>Erode</option>
<option>Trichy</option>
<option>Thanjavur</option>
<option>Namakkal</option>
<option>Karur</option>
<option>Thoothukudi</option>
<option>Vellore</option>
<option>Virudhunagar</option>
</select>

</div>

<button onclick="loginUser()">Login</button>

<div class="signup">
    <p>Don't have an account?
        <a href="signup.html" onclick="signUp()">Sign Up</a>
    </p>
</div>
<div id="message"></div>

</div>

<script>

function loginUser(){

    let mobile=document.getElementById("mobile").value;

    if(mobile===""){
        alert("Please enter your mobile number.");
        return;
    }

    if(!/^[6-9]\d{9}$/.test(mobile)){
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    // Redirect to Dashboard
    window.location.href="home.html";
}

function signUp(){

     window.location.href="signup.html";
}

</script>

</body>
</html>
